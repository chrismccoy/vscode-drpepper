<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3284d"/>
      <stop offset="1" stop-color="#5a1029"/>
    </linearGradient>
    <linearGradient id="soda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1a0c"/>
      <stop offset="1" stop-color="#1f0905"/>
    </linearGradient>
    <clipPath id="glass">
      <path d="M150 150 L362 150 L340 440 Q338 456 322 456 L190 456 Q174 456 172 440 Z"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- soda and foam, clipped to the glass -->
  <g clip-path="url(#glass)">
    <rect x="140" y="205" width="232" height="260" fill="url(#soda)"/>
    <rect x="140" y="188" width="232" height="26" fill="#f6ead6"/>
    <circle cx="172" cy="214" r="13" fill="#f6ead6"/>
    <circle cx="204" cy="217" r="12" fill="#f6ead6"/>
    <circle cx="236" cy="214" r="13" fill="#f6ead6"/>
    <circle cx="268" cy="218" r="12" fill="#f6ead6"/>
    <circle cx="300" cy="214" r="13" fill="#f6ead6"/>
    <circle cx="332" cy="217" r="12" fill="#f6ead6"/>
    <!-- "ipsum" text lines -->
    <rect x="194" y="262" width="124" height="18" rx="9" fill="#f6ead6"/>
    <rect x="194" y="302" width="100" height="18" rx="9" fill="#f6ead6"/>
    <rect x="194" y="342" width="118" height="18" rx="9" fill="#f6ead6"/>
    <rect x="194" y="382" width="80" height="18" rx="9" fill="#f6ead6"/>
  </g>

  <!-- glass outline -->
  <path d="M150 150 L362 150 L340 440 Q338 456 322 456 L190 456 Q174 456 172 440 Z"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" opacity="0.92"/>
  <path d="M168 176 L184 420" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- bubbles -->
  <circle cx="296" cy="112" r="16" fill="none" stroke="#ffffff" stroke-width="7"/>
  <circle cx="244" cy="84" r="11" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="322" cy="62" r="8" fill="#ffffff"/>
  <circle cx="216" cy="122" r="7" fill="#ffffff"/>
</svg>
